services:
  gopay-gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: gopay-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - INTERNAL_PORT=3001
      - INTERNAL_HOST=0.0.0.0
      - NODE_ENV=production
      - PUBLIC_GATEWAY_URL=${PUBLIC_GATEWAY_URL:-http://localhost:3000}
    volumes:
      - gateway-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gopay-admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: gopay-admin
    restart: unless-stopped
    depends_on:
      gopay-gateway:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      - ADMIN_PORT=3100
      - NODE_ENV=production
      - GATEWAY_INTERNAL_URL=http://gopay-gateway:3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/admin/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gateway-data:
